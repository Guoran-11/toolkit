# ============================================================================
# 全能工具站（ToolKit）—— Nginx 反向代理配置
#
# 用途：把内网/公网的 HTTPS 请求转发到本机 5000 端口的应用。
# 放置：/etc/nginx/conf.d/toolkit.conf（或 sites-available 下并软链）
#
# 关键点（每一条都对应一个真实的坑）：
#   1. client_max_body_size 必须 ≥ config.toml 各模块上传上限的最大值
#      （max_upload_mb / max_audio_upload_mb），
#      否则大文件会在 Nginx 层被 413 拦截，应用根本收不到请求；
#   2. /ws/ 必须单独配置 Upgrade/Connection 头，否则 SSH 终端握手失败；
#   3. 代理读超时要放宽——LibreOffice 转换大文件可能超过默认的 60 秒；
#   4. 应用自身已下发 CSP/X-Frame-Options 等安全头，此处不要重复设置，
#      否则会出现两套冲突的头导致浏览器策略异常；
#   5. 必须透传 X-Forwarded-For，否则审计日志与 SSH 白名单只能看到 Nginx 的 IP。
# ============================================================================

# 上游应用
upstream toolkit_app {
    server 127.0.0.1:5000;
    keepalive 32;
}

# 映射 WebSocket 升级头
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    # 改成你的域名；纯内网部署可写 IP 或内网 DNS 名
    server_name toolkit.example.com;

    # ------------------------------------------------------------------
    # 建议：对外提供服务时启用 HTTPS 并强制跳转。取消下面注释并配置证书。
    # ------------------------------------------------------------------
    # return 301 https://$host$request_uri;

    # 上传体积上限。必须 ≥ config.toml 里**所有**模块上限的最大值，并留出 multipart 开销。
    # 例：max_upload_mb = 100 / max_audio_upload_mb = 200 → 这里写 256m
    client_max_body_size 256m;

    # 大文件上传/转换期间保持连接，避免 Nginx 提前断开
    client_body_timeout 300s;

    # 全局代理超时：转换类请求走的是"提交即返回 + 轮询"，本身很快；
    # 但上传大文件与下载产物可能较慢，因此放宽到 10 分钟。
    proxy_connect_timeout 30s;
    proxy_send_timeout    600s;
    proxy_read_timeout    600s;

    # 关闭代理缓冲可让下载更快开始（产物文件通常不小）
    proxy_buffering off;
    proxy_request_buffering off;

    # 基础透传头
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ------------------------------------------------------------------
    # SSH 终端 WebSocket 通道
    # 必须放在最前面，且单独配置 Upgrade 头——通用 location 会丢掉它。
    # ------------------------------------------------------------------
    location /ws/ {
        proxy_pass http://toolkit_app;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # 终端空闲时也要保持长连接，超时需显著放大（默认 60s 会被掐断）
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;

        # WebSocket 不应被缓冲，否则文本输出会延迟到达
        proxy_buffering off;
    }

    # ------------------------------------------------------------------
    # API 与健康检查
    # ------------------------------------------------------------------
    location /api/ {
        proxy_pass http://toolkit_app;
    }

    location = /healthz {
        proxy_pass http://toolkit_app;
        # 健康检查不需要写访问日志，减少噪音
        access_log off;
    }

    # ------------------------------------------------------------------
    # 前端静态资源（由应用内的 StaticFiles 提供）
    # 带指纹的 vendor 资源可长缓存；index.html 必须不缓存，否则前端更新不生效。
    # ------------------------------------------------------------------
    location / {
        proxy_pass http://toolkit_app;
    }

    location = /index.html {
        proxy_pass http://toolkit_app;
        add_header Cache-Control "no-store, must-revalidate";
    }

    location ~* ^/(js|css|fonts|vendor)/ {
        proxy_pass http://toolkit_app;
        # 静态资源版本随发布变化，可放宽缓存
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # 隐藏 Nginx 版本号
    server_tokens off;
}

# ============================================================================
